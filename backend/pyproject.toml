[project]
name = "inboxkeeper"
version = "0.1.0"
description = "Local, conservative inbox cleanup for Gmail and beyond"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
inboxkeeper = "inboxkeeper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inboxkeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
